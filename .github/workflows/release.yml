name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            docs/LIMITATIONS.md
          body: |
            ## QCI PQC Readiness Scanner ${{ github.ref_name }}

            **Read the limitations before relying on results:**
            See [docs/LIMITATIONS.md](docs/LIMITATIONS.md) in this release.

            ### Install
            ```bash
            pip install qci-pqc-scan
            ```

            ### Verify
            ```bash
            sha256sum -c SHA256SUMS
            ```
          draft: false
          generate_release_notes: true
