name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]" jsonschema || pip install -e . pytest jsonschema

      - name: Golden corpus
        run: |
          PYTHONPATH=src python -m pytest tests/ -q --ignore=tests/test_resolve_wiring.py
          # Semgrep is optional; do not fail CI if the binary is absent
          PYTHONPATH=src python -m pytest tests/test_corpus.py::test_semgrep_corpus -q || echo "Semgrep adapter skipped or unavailable"

      - name: Smoke scan + CBOM schema validation
        run: |
          PYTHONPATH=src python -m qci_pqc.cli scan tests/corpus --reproducible --out /tmp/ci-out
          test -f /tmp/ci-out/cbom.json
          test -f /tmp/ci-out/report.html
          test -f /tmp/ci-out/evidence-manifest.json
          # Validate CBOM against CycloneDX 1.6 schema
          python - << 'PY'
          import json, urllib.request
          from jsonschema import validate
          schema_url = "https://raw.githubusercontent.com/CycloneDX/specification/master/schema/bom-1.6.schema.json"
          try:
              schema = json.load(urllib.request.urlopen(schema_url, timeout=30))
              bom = json.load(open("/tmp/ci-out/cbom.json"))
              validate(instance=bom, schema=schema)
              print("CBOM schema validation: PASS")
          except Exception as e:
              print(f"CBOM schema validation: FAIL ({e})")
              raise
          PY

      - name: Calibration gate
        run: |
          PYTHONPATH=src python -m qci_pqc.cli scan tests/corpus --calibrate --json > /tmp/cal.json
          python - << 'PY'
          import json
          m = json.load(open("/tmp/cal.json"))
          assert m["recall"] >= 0.9, f"Recall too low: {m['recall']}"
          assert m["false_positives"] == 0, f"False positives on negative files: {m['false_positives']}"
          print(f"Calibration gate: PASS (recall={m['recall']}, fp={m['false_positives']})")
          PY

  release-check:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency
        run: |
          grep -q 'version = "2.3.3"' pyproject.toml
          grep -q '__version__ = "2.3.3"' src/qci_pqc/__init__.py
          echo "Version check: PASS"
