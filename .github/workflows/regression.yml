name: Regression gate

on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[x509]"
      - name: Fail on a new vulnerable finding
        run: |
          if [ -f baseline.json ]; then
            pql-cli diff . --baseline baseline.json
          else
            echo "No baseline.json; skipping regression gate"
          fi
