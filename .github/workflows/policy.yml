name: Policy gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[x509]"
      - name: Fail on vulnerable findings without an acceptance
        run: |
          cat > /tmp/policy.json << 'POL'
          {"fail_on": ["vulnerable"]}
          POL
          qci-pqc scan tests/corpus --out /tmp/scan --policy /tmp/policy.json
