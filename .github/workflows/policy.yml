name: Policy gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -e ".[x509]"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Package installation failed (attempt $attempt/3); retrying in 10 seconds"
              sleep 10
            fi
          done
          exit 1
      - name: Fail on vulnerable findings without an acceptance
        run: |
          cat > /tmp/policy.json << 'POL'
          {"fail_on": ["vulnerable"]}
          POL
          set +e
          qci-pqc scan tests/corpus --out /tmp/scan --policy /tmp/policy.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected policy violations to exit 1, got $status"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/scan/policy-result.json").read_text())
          if result.get("passed") or not result.get("violations"):
              raise SystemExit("Expected unaccepted policy violations")
          PY
