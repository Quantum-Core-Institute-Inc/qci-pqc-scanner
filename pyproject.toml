[project]
name = "qci-pqc-scan"
version = "2.3.4"
description = "QCI crypto inventory of source, config, and artifacts. Exports a CycloneDX CBOM."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Quantum Core Institute"}]
dependencies = ["click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jsonschema>=4.0"]
x509 = ["cryptography>=42.0"]

[project.scripts]
qci-pqc = "qci_pqc.cli:cli"
pql-cli = "qci_pqc.pql:pql"

[tool.setuptools.packages.find]
where = ["src"]
