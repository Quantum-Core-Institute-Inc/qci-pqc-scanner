[project]
name = "qci-pqc-scan"
version = "0.3.0"
description = "QCI PQC Readiness Scanner – cryptographic inventory and post-quantum assessment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Quantum Core Institute"}]
dependencies = ["click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
x509 = ["cryptography>=42.0"]

[project.scripts]
qci-pqc = "qci_pqc.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
